services:
  oracle:
    image: 'gvenzl/oracle-free:latest'
    environment:
      - ORACLE_PASSWORD=secret
      - APP_USER=productos_user
      - APP_USER_PASSWORD=productos_pass
    ports:
      - '1521:1521'
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle_data: