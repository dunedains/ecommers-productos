server.port=8081
spring.application.name=productos

# DataSource Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/FREEPDB1
spring.datasource.username=productos_user
spring.datasource.password=productos_pass
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:oracle:thin:@localhost:1522/FREEPDB1
spring.flyway.user=productos_user
spring.flyway.password=productos_pass
spring.flyway.schemas=PRODUCTOS_USER
spring.flyway.locations=classpath:db/migration